# application.properties
spring.application.name=todo-management-application-mysql-restapi

server.port=9090

logging.level.org.springframework=info
logging.level.in.pumo.todo.restapi=debug

spring.mvc.format.date=yyyy-MM-dd

spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# MySQL Database Connection Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_todo_restapi
spring.datasource.username=root
spring.datasource.password=30092004